# Inkwell Android build settings
# NOTE: the sandbox CI box this project was validated on has only 1 GB RAM;
# if you build on a similarly tiny machine, override with:
#   -Dorg.gradle.jvmargs="-Xmx448m -Xss256k -XX:MaxMetaspaceSize=224m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC"
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
